aid: generalproximity
name: General Proximity
description: General Proximity is a biotechnology company pioneering next-generation
  "proximity medicines" that control biological processes by inducing proximity between
  molecular targets. Its multi-target OMNITAC platform is used to discover and advance
  novel therapeutics, including an oncology collaboration with Daiichi Sankyo. The company
  is backed by investors including Felicis and Y Combinator, and has drawn investment
  from Freemind and Daewoong Pharmaceutical. This is a company profile in the API Evangelist
  network; General Proximity is a drug-discovery company and does not publish a public API,
  developer portal, or machine-readable API artifacts at this time.
